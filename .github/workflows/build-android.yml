name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

env:
  NODE_VERSION: '18'
  ANDROID_API_LEVEL: 33
  BUILD_TOOLS: '33.0.2'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check repository structure
        run: |
          echo "Current directory: $(pwd)"
          ls -la
          ls -la package.json 2>/dev/null || echo "package.json NOT FOUND"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install NPM dependencies
        run: |
          if [ ! -f package.json ]; then
            echo "ERROR: package.json not found!"
            exit 1
          fi
          npm install

      - name: Copy web libs into www
        run: |
          mkdir -p www/libs
          cp node_modules/html2canvas/dist/html2canvas.min.js www/libs/ 2>/dev/null || true
          cp node_modules/jspdf/dist/jspdf.umd.min.js www/libs/ 2>/dev/null || true
          cp node_modules/esc-pos-encoder/dist/esc-pos-encoder.min.js www/libs/ 2>/dev/null || true

      - name: Add Android platform (if not exists)
        run: |
          if [ ! -d "android" ]; then
            echo "Adding Android platform..."
            npx cap add android
          else
            echo "Android platform already exists"
          fi

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Set up Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Ensure Android SDK & command-line tools + install platform/build-tools
        run: |
          set -euo pipefail
          export ANDROID_SDK_ROOT="$HOME/Android/Sdk"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}" >> $GITHUB_ENV
          mkdir -p "${ANDROID_SDK_ROOT}"

          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
            echo "Found sdkmanager at: $SDKMANAGER"
          else
            if [ -x "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" ]; then
              SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
            elif [ -x "${ANDROID_SDK_ROOT}/tools/bin/sdkmanager" ]; then
              SDKMANAGER="${ANDROID_SDK_ROOT}/tools/bin/sdkmanager"
            else
              echo "Downloading Android command-line tools..."
              CMDLINE_ZIP="${RUNNER_TEMP:-/tmp}/commandlinetools.zip"
              curl -fSL "https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip" -o "$CMDLINE_ZIP"
              mkdir -p "${ANDROID_SDK_ROOT}/cmdline-tools"
              unzip -q "$CMDLINE_ZIP" -d "${ANDROID_SDK_ROOT}/cmdline-tools/temp"
              mkdir -p "${ANDROID_SDK_ROOT}/cmdline-tools/latest"
              if [ -d "${ANDROID_SDK_ROOT}/cmdline-tools/temp/cmdline-tools" ]; then
                mv "${ANDROID_SDK_ROOT}/cmdline-tools/temp/cmdline-tools/"* "${ANDROID_SDK_ROOT}/cmdline-tools/latest/"
              else
                mv "${ANDROID_SDK_ROOT}/cmdline-tools/temp/"* "${ANDROID_SDK_ROOT}/cmdline-tools/latest/"
              fi
              rm -rf "${ANDROID_SDK_ROOT}/cmdline-tools/temp" "$CMDLINE_ZIP"
              SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
            fi
          fi

          echo "Using sdkmanager: $SDKMANAGER"
          export PATH="${ANDROID_SDK_ROOT}/platform-tools:${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin:${PATH}"

          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses || true
            "$SDKMANAGER" "platform-tools" "platforms;android-${ANDROID_API_LEVEL}" "build-tools;${BUILD_TOOLS}" || true
          else
            echo "sdkmanager not executable at $SDKMANAGER"
          fi

      - name: Make gradlew executable
        run: |
          if [ -f android/gradlew ]; then
            chmod +x android/gradlew
          fi

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

  release:
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install NPM dependencies
        run: npm install

      - name: Copy web libs into www
        run: |
          mkdir -p www/libs
          cp node_modules/html2canvas/dist/html2canvas.min.js www/libs/ 2>/dev/null || true
          cp node_modules/jspdf/dist/jspdf.umd.min.js www/libs/ 2>/dev/null || true
          cp node_modules/esc-pos-encoder/dist/esc-pos-encoder.min.js www/libs/ 2>/dev/null || true

      - name: Add Android platform (if not exists)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Set up Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare and build signed Release (if keystore secret provided)
        id: signed_build
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          
          export ANDROID_SDK_ROOT="$HOME/Android/Sdk"
          export PATH="${ANDROID_SDK_ROOT}/platform-tools:${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin:${PATH}"
          
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "KEYSTORE_BASE64 not set — skipping signed release build."
            exit 0
          fi

          mkdir -p android/app
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore

          cat > android/keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=${KEYSTORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF

          if [ -f android/gradlew ]; then
            chmod +x android/gradlew
            (cd android && ./gradlew assembleRelease --no-daemon)
          else
            echo "android/gradlew not found"
            exit 1
          fi

      - name: Upload Release APK artifact
        if: steps.signed_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/app-release.apk

name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

env:
  NODE_VERSION: '18'
  ANDROID_API_LEVEL: 33
  BUILD_TOOLS: '33.0.2'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install NPM dependencies
        run: npm ci

      - name: Copy web libs into www
        run: |
          mkdir -p www/libs
          cp node_modules/html2canvas/dist/html2canvas.min.js www/libs/ || true
          cp node_modules/jspdf/dist/jspdf.umd.min.js www/libs/ || true
          cp node_modules/esc-pos-encoder/dist/esc-pos-encoder.min.js www/libs/ || true

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Set up Android SDK
        uses: r0adkll/setup-android@v2
        with:
          api-level: ${{ env.ANDROID_API_LEVEL }}
          build-tools: ${{ env.BUILD_TOOLS }}

      - name: Make gradlew executable
        run: if [ -f android/gradlew ]; then chmod +x android/gradlew; fi

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

  release:
    needs: build
    runs-on: ubuntu-latest
    if: secrets.KEYSTORE_BASE64 != ''
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Decode keystore secret
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Create keystore properties (for Gradle signing)
        run: |
          cat > android/keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/app-release.apk

name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

env:
  NODE_VERSION: '18'
  ANDROID_API_LEVEL: 33
  BUILD_TOOLS: '33.0.2'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check repository structure
        run: |
          echo "Current directory: $(pwd)"
          ls -la
          echo "Android SDK location:"
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la $ANDROID_HOME 2>/dev/null || echo "ANDROID_HOME not set"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install NPM dependencies
        run: |
          if [ ! -f package.json ]; then
            echo "ERROR: package.json not found!"
            exit 1
          fi
          npm install

      - name: Prepare www folder
        run: |
          mkdir -p www
          cp *.html www/ 2>/dev/null || true
          cp *.js www/ 2>/dev/null || true
          cp *.css www/ 2>/dev/null || true
          mkdir -p www/libs
          cp node_modules/html2canvas/dist/html2canvas.min.js www/libs/ 2>/dev/null || true
          cp node_modules/jspdf/dist/jspdf.umd.min.js www/libs/ 2>/dev/null || true
          cp node_modules/esc-pos-encoder/dist/esc-pos-encoder.min.js www/libs/ 2>/dev/null || true
          echo "www folder contents:"
          ls -la www/

      - name: Add Android platform (if not exists)
        run: |
          if [ ! -d "android" ]; then
            echo "Adding Android platform..."
            npx cap add android
          else
            echo "Android platform already exists"
          fi

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Set up Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        run: |
          # Gunakan Android SDK yang sudah ada di runner
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "Using system Android SDK at: $ANDROID_HOME"
          
          # Install platform dan build-tools yang diperlukan
          sdkmanager --install "platforms;android-${ANDROID_API_LEVEL}" "build-tools;${BUILD_TOOLS}" || true

      - name: Make gradlew executable
        run: |
          if [ -f android/gradlew ]; then
            chmod +x android/gradlew
          fi

      - name: Build Debug APK
        working-directory: android
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

  release:
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install NPM dependencies
        run: npm install

      - name: Prepare www folder
        run: |
          mkdir -p www
          cp *.html www/ 2>/dev/null || true
          cp *.js www/ 2>/dev/null || true
          cp *.css www/ 2>/dev/null || true
          mkdir -p www/libs
          cp node_modules/html2canvas/dist/html2canvas.min.js www/libs/ 2>/dev/null || true
          cp node_modules/jspdf/dist/jspdf.umd.min.js www/libs/ 2>/dev/null || true
          cp node_modules/esc-pos-encoder/dist/esc-pos-encoder.min.js www/libs/ 2>/dev/null || true

      - name: Add Android platform (if not exists)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Set up Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          sdkmanager --install "platforms;android-${ANDROID_API_LEVEL}" "build-tools;${BUILD_TOOLS}" || true

      - name: Prepare and build signed Release (if keystore secret provided)
        id: signed_build
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "KEYSTORE_BASE64 not set — skipping signed release build."
            exit 0
          fi

          mkdir -p android/app
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore

          cat > android/keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=${KEYSTORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF

          if [ -f android/gradlew ]; then
            chmod +x android/gradlew
            (cd android && ./gradlew assembleRelease --no-daemon)
          else
            echo "android/gradlew not found"
            exit 1
          fi

      - name: Upload Release APK artifact
        if: steps.signed_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/app-release.apk

name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

env:
  NODE_VERSION: '18'
  ANDROID_API_LEVEL: 33
  BUILD_TOOLS: '33.0.2'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install NPM dependencies
        run: npm ci

      - name: Copy web libs into www
        run: |
          mkdir -p www/libs
          cp node_modules/html2canvas/dist/html2canvas.min.js www/libs/ || true
          cp node_modules/jspdf/dist/jspdf.umd.min.js www/libs/ || true
          cp node_modules/esc-pos-encoder/dist/esc-pos-encoder.min.js www/libs/ || true

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Set up Android SDK
        uses: r0adkll/setup-android@v2
        with:
          api-level: ${{ env.ANDROID_API_LEVEL }}
          build-tools: ${{ env.BUILD_TOOLS }}

      - name: Make gradlew executable
        run: if [ -f android/gradlew ]; then chmod +x android/gradlew; fi

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

  release:
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build signed Release (only if keystore secret provided)
        id: signed_build
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # If KEYSTORE_BASE64 is not set or empty, skip signed release gracefully
          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "KEYSTORE_BASE64 not set — skipping signed release build."
            exit 0
          fi

          set -euo pipefail
          mkdir -p android/app
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore

          cat > android/keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=${KEYSTORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF

          # ensure gradlew exists and is executable
          if [ -f android/gradlew ]; then
            chmod +x android/gradlew
            (cd android && ./gradlew assembleRelease --no-daemon)
          else
            echo "android/gradlew not found; make sure 'npx cap sync android' produced the android project."
            exit 1
          fi

      - name: Upload Release APK artifact
        if: steps.signed_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/app-release.apk
